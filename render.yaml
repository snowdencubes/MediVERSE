services:
  # Rekov Unified Kiosk & AI Voice Service (FastAPI + Next.js UI)
  - type: web
    name: rekov
    env: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    region: oregon
    plan: free
    envVars:
      - key: PORT
        value: 10000
      - key: PYTHONUNBUFFERED
        value: "1"
